name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build packages
        run: npm run package

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Compositore Diplomi ${{ steps.version.outputs.value }}
          files: |
            dist/Compositore Diplomi Setup ${{ steps.version.outputs.value }}.exe
            dist/Compositore Diplomi ${{ steps.version.outputs.value }}.exe
